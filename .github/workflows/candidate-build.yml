name: Build and check candidate directory
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python scripts/check-candidate-data.py
      - run: git ls-files --error-unmatch data/candidates/registry.json data/candidates/enrichment.json editorial/candidate-portrait-provenance.json assets/candidates/etzer-emile-320.webp assets/candidates/jude-elie-320.webp
      - run: python scripts/build-candidates.py
      - run: python scripts/build-candidates.py --check
      - run: python scripts/build-elections.py --check
      - run: node --check candidate-common.js && node --check candidate-directory.js && node --check candidate-web.js
